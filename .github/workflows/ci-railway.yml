name: CI — Build & Optional Railway Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build frontend, backend, and Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Frontend Build
      # -------------------------
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # -------------------------
      # Backend Build
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-prod.txt

      # -------------------------
      # Docker Build (LOCAL ONLY)
      # -------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: med-guardian:latest

  deploy:
    name: Deploy to Railway (if secrets available)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_API_KEY && secrets.RAILWAY_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Login to Railway
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: railway login --apiKey $RAILWAY_API_KEY

      - name: Trigger Railway Deploy
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          # Trigger remote redeploy
          railway up --yes --project $RAILWAY_PROJECT_ID || true
